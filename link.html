<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSEB Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .main-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .portal-card {
            background: #fff;
            width: 100%;
            max-width: 850px;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .title {
            font-size: 34px;
            font-weight: 700;
            color: #0d4b8f;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 45px;
        }

        .exam-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: #fff;
            text-decoration: none;
            padding: 18px 22px;
            border-radius: 14px;
            margin-bottom: 20px;
            transition: 0.3s;
            font-size: 18px;
            font-weight: 600;
        }

            .exam-btn:hover {
                transform: translateY(-3px);
                color: #fff;
                box-shadow: 0 10px 20px rgba(13,110,253,0.25);
            }

            .exam-btn i {
                font-size: 22px;
            }

        .footer-text {
            margin-top: 35px;
            color: #888;
            font-size: 14px;
        }

        @media(max-width:768px) {

            .portal-card {
                padding: 40px 20px;
            }

            .title {
                font-size: 28px;
            }

            .exam-btn {
                font-size: 15px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <div class="portal-card">

            <!-- Logo -->
            <img src="img/bseorissa-logo-w.png" alt="Logo" class="logo">

            <!-- Website Name -->
            <h1 class="title">
                Bihar School Examination Board
            </h1>

            <p class="subtitle">
                Examination Portal 2026
            </p>

            <!-- Links -->

            <a href="IntermediateAnnual2026.aspx" class="exam-btn">
                <span>
                    1.) INTERMEDIATE ANNUAL EXAMINATION 2026
                </span>

                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="IntermediateSpecialCompartmental2026.aspx" class="exam-btn">
                <span>
                    2.) INTERMEDIATE SPECIAL & COMPARTMENTAL EXAMINATION 2026
                </span>

                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- Footer -->
            <div class="footer-text">
                © 2026 Bihar School Examination Board
            </div>

        </div>

    </div>

</body>
</html>
