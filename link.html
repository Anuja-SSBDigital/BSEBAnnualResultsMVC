<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSEB Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .main-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .portal-card {
            background: #fff;
            width: 100%;
            max-width: 760px;
            border-radius: 20px;
            padding: 45px 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            margin-bottom: 18px;
        }

        .title {
            font-size: 30px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 35px;
        }

        /* DARK SMALL LINKS */

        .exam-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            color: #f1f5f9;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 14px;
            transition: 0.3s;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #334155;
        }

            .exam-btn:hover {
                background: #0f172a;
                color: #fff;
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(15,23,42,0.18);
            }

            .exam-btn i {
                font-size: 14px;
            }

        .footer-text {
            margin-top: 28px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media(max-width:768px) {

            .portal-card {
                padding: 35px 20px;
            }

            .title {
                font-size: 24px;
            }

            .exam-btn {
                font-size: 13px;
                padding: 13px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <div class="portal-card">

            <!-- Logo -->
            <img src="images/logo.png" alt="Logo" class="logo">

            <!-- Website Name -->
            <h1 class="title">
                Bihar School Examination Board
            </h1>

            <p class="subtitle">
                Examination Portal 2026
            </p>

            <!-- Links -->

            <a href="IntermediateAnnual2026.aspx" class="exam-btn">
                <span>
                    1.) INTERMEDIATE ANNUAL EXAMINATION 2026
                </span>

                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="IntermediateSpecialCompartmental2026.aspx" class="exam-btn">
                <span>
                    2.) INTERMEDIATE SPECIAL & COMPARTMENTAL EXAMINATION 2026
                </span>

                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- Footer -->
            <div class="footer-text">
                © 2026 Bihar School Examination Board
            </div>

        </div>

    </div>

</body>
</html>
